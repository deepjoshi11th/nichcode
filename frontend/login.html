<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - નીચકોડ</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">નીચકોડ</a>
        </nav>
    </header>
    
    <main>
        <!-- Authentication Section -->
        <div id="auth-section" class="hero">
            <h1>નીચકોડ</h1>
            <p class="subtitle">Just another hobby project</p>
            
            <!-- Error Message -->
            <div id="error-message" style="display: none; color: #ff6b6b; text-align: center; margin-bottom: 1rem; padding: 1rem; background-color: rgba(255, 107, 107, 0.1); border-radius: 8px;"></div>
            
            <!-- Login Form -->
            <div id="login-form" class="form-container">
                <div class="form-box">
                    <h2>Sign In</h2>
                    <form id="login-form-element">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="form-submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                    </form>
                    <div class="form-footer">
                        Don't have an account? <a href="#" id="show-signup-btn">Sign up</a>
                    </div>
                </div>
            </div>
            
            <!-- Signup Form -->
            <div id="signup-form" class="form-container" style="display: none;">
                <div class="form-box">
                    <h2>Create Account</h2>
                    <form id="signup-form-element">
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" placeholder="••••••••" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-confirm-password">Confirm Password</label>
                            <input type="password" id="signup-confirm-password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="form-submit"><i class="fas fa-user-plus"></i> Create Account</button>
                    </form>
                    <div class="form-footer">
                        Already have an account? <a href="#" id="show-login-btn">Sign in</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
